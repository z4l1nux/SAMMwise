name: TruffleHog Secret Scanner

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite rodar manualmente

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trufflehog:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0 # Necessário baixar todo o histórico para o scanner procurar nas history trees

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@23255461ddf3958c4d949d89925b03eaf263d838
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --results=verified,unknown,unverified --debug